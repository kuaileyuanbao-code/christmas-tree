name: Publish Christmas Tree to GitHub Pages

# 只手动发布；先配置Cloudflare和仓库变量，再由树主人明确点击Run workflow。
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate public API URL and derive Pages base
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          PAGES_BASE_PATH: ${{ vars.PAGES_BASE_PATH }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const api = process.env.VITE_API_URL;
          if (!api) throw new Error('Set repository variable VITE_API_URL first.');
          const url = new URL(api);
          if (url.protocol !== 'https:' || url.pathname !== '/' || url.username || url.password || url.search || url.hash) throw new Error('VITE_API_URL must be the HTTPS Worker origin, without /api or credentials.');
          const repo = process.env.REPOSITORY_NAME;
          const base = process.env.PAGES_BASE_PATH || (repo.endsWith('.github.io') ? '/' : `/${repo}/`);
          if (!/^\/(?:[A-Za-z0-9._-]+\/)*$/.test(base)) throw new Error('PAGES_BASE_PATH must look like /repo/ or /.');
          appendFileSync(process.env.GITHUB_ENV, `VITE_API_URL=${url.origin}\nVITE_BASE_PATH=${base}\n`);
          NODE
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
